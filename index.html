<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Sols — Archive Decrypting</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital@0;1&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html { scroll-behavior: smooth; }
    
    body {
      background-color: #000000;
      color: #f0e8d0;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 20px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── STARFIELD CANVAS ── */
    #star-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      display: block;
      will-change: auto;
      transform: translateZ(0);
    }

    /* ── SPACE DUST CANVAS ── */
    #dust-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      display: block;
    }

    /* ── CONTENT ── */
    .construction-wrap {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .sam-b-message {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      color: #00ffcc;
      letter-spacing: 0.1em;
      margin-bottom: 4rem;
      min-height: 80px;
      max-width: 600px;
      text-align: center;
    }

    .message-line {
      display: block;
      margin-bottom: 0.8rem;
      min-height: 1.2em;
    }

    /* ── TYPING CURSOR ── */
    .typed-cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: #00ffcc;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1.2s step-end infinite;
      position: relative;
      top: 0.05em;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

/* ── ACCESS DENIED CARD ── */
    .access-card {
      border: 1px solid #ff4444;
      border-radius: 2px;
      padding: 0.8rem 1rem;
      background: rgba(255, 68, 68, 0.02);
      position: relative;
      animation: card-pulse 3s ease-in-out infinite;
      display: inline-block;
    }

    .access-card::before,
    .access-card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border: 1px solid #ff4444;
    }

    .access-card::before {
      top: -6px; left: -6px;
      border-right: none;
      border-bottom: none;
    }

    .access-card::after {
      bottom: -6px; right: -6px;
      border-left: none;
      border-top: none;
    }

    .card-status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: #ff4444;
      letter-spacing: 0.15em;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
    }

    .card-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      font-weight: 400;
      color: #ff4444;
      margin-bottom: 0.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .card-subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: #cc3333;
      letter-spacing: 0.12em;
      margin-top: 0.6rem;
    }

    @keyframes card-pulse {
      0%, 100% { 
        border-color: #ff4444;
        box-shadow: 0 0 10px rgba(255, 68, 68, 0.1);
      }
      50% {
        border-color: #cc3333;
        box-shadow: 0 0 20px rgba(255, 68, 68, 0.2);
      }
    }

    /* ── FOOTER MESSAGE ── */
    .footer-message {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: #606060;
      letter-spacing: 0.1em;
      margin-top: 3rem;
      line-height: 1.8;
    }

    .footer-message div {
      margin-bottom: 0.5rem;
    }

    @media (max-width: 768px) {
      .sam-b-message {
        font-size: 0.75rem;
        margin-bottom: 2rem;
      }

      .card-title {
        font-size: 1rem;
      }

      .access-card {
        padding: 1rem 1.2rem;
      }
    }
  </style>
</head>
<body>

<!-- STARFIELD -->
<canvas id="star-canvas" width="1920" height="1080"></canvas>

<!-- SPACE DUST -->
<canvas id="dust-canvas" width="1920" height="1080"></canvas>

<!-- CONTENT -->
<div class="construction-wrap">
  <div class="sam-b-message">
    <div class="message-line" id="msg-1"></div>
    <div class="message-line" id="msg-2"></div>
    <div class="message-line" id="msg-3"></div>
  </div>

  <div class="access-card">
    <div class="card-status">// DECRYPTING...</div>
    <div class="card-title">ACCESS DENIED</div>
    <div class="card-subtitle">// ENCRYPTION PROTOCOL ACTIVE</div>
  </div>

  <div class="footer-message">
    <div>// Sam-B is still recovering this archive.</div>
    <div>// Return soon for the full chronicle.</div>
  </div>
</div>

<script>
// ── STARFIELD ──
const starCanvas = document.getElementById('star-canvas');
const sctx = starCanvas.getContext('2d');
const STAR_COUNT = 300;

// Set canvas size immediately
starCanvas.width = document.documentElement.clientWidth;
starCanvas.height = document.documentElement.clientHeight;

function resizeStars() {
  starCanvas.width = document.documentElement.clientWidth;
  starCanvas.height = document.documentElement.clientHeight;
}

let stars = [];
const isMobile = window.innerWidth < 768;

function generateStars() {
  stars = [];
  const maxSz = isMobile ? 1.8 : 3.5;
  const minSz = isMobile ? 0.4 : 0.6;
  for (let i = 0; i < STAR_COUNT; i++) {
    const sz = Math.random() * maxSz + minSz;
    const isTwinkler = Math.random() < 0.3;
    stars.push({
      x:      Math.random() * starCanvas.width,
      y:      Math.random() * starCanvas.height,
      sz,
      baseA:  Math.random() * 0.4 + 0.6,
      phase:  Math.random() * Math.PI * 2,
      speed:  isTwinkler ? Math.random() * 1.8 + 0.8 : Math.random() * 0.3 + 0.1,
      twinkleAmp: isTwinkler ? Math.random() * 0.45 + 0.35 : Math.random() * 0.08 + 0.02,
      sizeAmp: isTwinkler ? Math.random() * 0.5 + 0.3 : 0.05,
      r: 255,
      g: Math.random() > 0.85 ? 240 : 255,
      b: Math.random() > 0.9  ? 200 : 255,
    });
  }
}

generateStars();
resizeStars();
window.addEventListener('resize', () => { resizeStars(); generateStars(); });

// Regenerate after page fully loads to ensure correct dimensions
window.addEventListener('load', () => {
  resizeStars();
  generateStars();
});

function drawStars() {
  sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  const t = performance.now() / 1000;

  stars.forEach(star => {
    const twinkle = Math.sin(t * star.speed + star.phase);
    const alpha   = Math.max(0.05, Math.min(1, star.baseA + twinkle * star.twinkleAmp));
    const size    = Math.max(0.3, star.sz + twinkle * star.sizeAmp);

    sctx.save();
    sctx.globalAlpha = alpha;

    if (!isMobile && size > 1.5) {
      sctx.shadowColor = `rgba(${star.r},${star.g},${star.b},0.8)`;
      sctx.shadowBlur  = size * 4;
    }

    sctx.beginPath();
    sctx.arc(star.x, star.y, size * 0.7, 0, Math.PI * 2);
    sctx.fillStyle = `rgb(${star.r},${star.g},${star.b})`;
    sctx.fill();

    sctx.restore();
  });
}

// ── SPACE DUST ──
const dustCanvas = document.getElementById('dust-canvas');
const dctx = dustCanvas.getContext('2d');

// Set canvas size immediately
dustCanvas.width = document.documentElement.clientWidth;
dustCanvas.height = document.documentElement.clientHeight;

class Fleck {
  constructor(fast) {
    this.x = Math.random() * dustCanvas.width;
    this.y = Math.random() * dustCanvas.height;
    this.sz = Math.random() * 1.2 + 0.3;
    this.spd = fast ? Math.random() * 0.08 + 0.04 : Math.random() * 0.02 + 0.005;
    this.opacity = Math.random() * 0.6 + 0.2;
    this.color = Math.random() > 0.9 ? '#00ffcc' : '#ffffff';
  }

  update() {
    this.y += scrollVel * this.spd * scrollDir * -1;
    if (this.y > dustCanvas.height + 4) this.y = -4;
    if (this.y < -4) this.y = dustCanvas.height + 4;
  }

  draw() {
    if (velocityMode === 'fast') {
      const len = this.sz * 6;
      dctx.strokeStyle = this.color;
      dctx.globalAlpha = this.opacity * 0.8;
      dctx.lineWidth = this.sz * 0.5;
      dctx.beginPath();
      dctx.moveTo(this.x, this.y + len * (scrollDir > 0 ? 1 : -1));
      dctx.lineTo(this.x, this.y);
      dctx.stroke();
    } else {
      dctx.fillStyle = this.color;
      dctx.globalAlpha = this.opacity;
      dctx.fillRect(this.x, this.y, this.sz, this.sz);
    }
  }
}

let scrollVel = 0, scrollDir = -1, decayTick = 0, lastScrollY = window.scrollY;
let velocityMode = 'slow';
const flecks = Array.from({ length: 150 }, () => new Fleck(true));

dustCanvas.width = document.documentElement.clientWidth;
dustCanvas.height = document.documentElement.clientHeight;

function resizeDust() {
  dustCanvas.width = document.documentElement.clientWidth;
  dustCanvas.height = document.documentElement.clientHeight;
}

window.addEventListener('resize', resizeDust);

function dustLoop() {
  dctx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
  decayTick++;
  if (decayTick > 2) {
    scrollVel *= 0.86;
    if (scrollVel < 0.04) scrollVel = 0;
  }
  flecks.forEach(f => { f.update(); f.draw(); });
}

window.addEventListener('scroll', () => {
  const delta = window.scrollY - lastScrollY;
  scrollVel = Math.abs(delta) * 1.3;
  scrollDir = delta >= 0 ? 1 : -1;
  velocityMode = scrollVel > 8 ? 'fast' : 'slow';
  decayTick = 0;
  lastScrollY = window.scrollY;
}, { passive: true });

function mainLoop() {
  drawStars();
  dustLoop();
  requestAnimationFrame(mainLoop);
}

mainLoop();

// ── TYPING ENGINE ──
const CHAR_SPEED = 28;
const LINE_PAUSE = 180;

function makeCursor() {
  const c = document.createElement('span');
  c.className = 'typed-cursor';
  return c;
}

async function runBootSequence() {
  const messages = [
    '// ARCHIVE ACCESS PROTOCOL INITIATED...',
    '// SCANNING LOST SOLS DATABASE...',
    '// WARNING: DECRYPTING CORE RECORDS...'
  ];

  const elements = [
    document.getElementById('msg-1'),
    document.getElementById('msg-2'),
    document.getElementById('msg-3')
  ];

  for (let lineIdx = 0; lineIdx < messages.length; lineIdx++) {
    const text = messages[lineIdx];
    const el = elements[lineIdx];
    el.innerHTML = '';

    // Type this line character by character
    for (let i = 0; i < text.length; i++) {
      el.textContent = text.slice(0, i + 1);
      el.appendChild(makeCursor());
      await new Promise(r => setTimeout(r, CHAR_SPEED));
    }

    // Remove cursor at end of line
    const cursor = el.querySelector('.typed-cursor');
    if (cursor) cursor.remove();

    // Add cursor to end of final line only
    if (lineIdx === messages.length - 1) {
      el.appendChild(makeCursor());
    }

    // Pause before next line
    if (lineIdx < messages.length - 1) {
      await new Promise(r => setTimeout(r, LINE_PAUSE));
    }
  }
}

// Start on page load
window.addEventListener('load', runBootSequence);
</script>

</body>
</html>
